pointcloud_to_laserscan_node:
  ros__parameters:
    target_frame: nav_laser_frame
    transform_tolerance: 0.2

    min_height: -0.10
    max_height: 0.50

    range_min: 0.45
    range_max: 8.0

    angle_min: -3.14159265
    angle_max: 3.12413936
    angle_increment: 0.01745329252

    scan_time: 0.1
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10