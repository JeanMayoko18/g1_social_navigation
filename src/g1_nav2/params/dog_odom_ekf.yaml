dog_odom_ekf:
  ros__parameters:
    use_sim_time: false

    frequency: 50.0
    sensor_timeout: 0.20
    two_d_mode: true

    publish_tf: false
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom_dog_calibrated
    odom0_config: [
      true,  true,  false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu_livox_corrected
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 50

    print_diagnostics: true