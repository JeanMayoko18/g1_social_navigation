# ==========================
# Nav2 (Humble) - REAL Robot - SLAM mode
# Frames expected:
#   map -> odom  (slam_toolbox)
#   odom -> base_footprint not robot_center (your odom/tf bridge from /dog_odom)
# Topics expected:
#   /odom (nav_msgs/Odometry)
#   /scan (sensor_msgs/LaserScan)
#   /cmd_vel_nav (Nav2 controller output)
#   /cmd_vel (velocity_smoother output -> rl_sar input)
# ==========================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    global_frame: map
    robot_base_frame: base_footprint
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odom

    # ✅ controller output goes to cmd_vel_nav
    cmd_vel_topic: /cmd_vel_nav

    controller_frequency: 20.0
    # --- IMPORTANT pour humanoid RL (évite micro-cmd qui ne bougent pas le robot) ---
    min_x_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.15
    failure_tolerance: 2.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      required_movement_radius: 0.03
      movement_time_allowance: 45.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.05 # was 0.25
      yaw_goal_tolerance: 0.10 # was 0.25

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # --- IMPORTANT: minimums (sinon Nav2 envoie 0.01..0.04 et ton robot ne bouge pas) ---
      min_vel_x: 0.08
      max_vel_x: 0.25

      min_speed_xy: 0.08
      max_speed_xy: 0.30

      min_speed_theta: 0.15  # <--- IMPORTANT (au lieu de 0.0)
      max_vel_theta: 0.8

      acc_lim_x: 1.0
      acc_lim_theta: 0.7         # <-- au lieu de 2.0
      decel_lim_x: -1.0
      decel_lim_theta: -0.7      # <-- au lieu de -2.0

      vx_samples: 10
      vtheta_samples: 10         # <-- au lieu de 20 (moins de solutions "spin")
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3


      #critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      critics: ["Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      #BaseObstacle.scale: 0.02
      #PathAlign.scale: 32.0
      #PathAlign.forward_point_distance: 0.325
      #GoalAlign.scale: 24.0
      #GoalAlign.forward_point_distance: 0.325
      #PathDist.scale: 32.0
      #GoalDist.scale: 24.0
      #RotateToGoal.scale: 32.0
      #RotateToGoal.slowing_factor: 5.0
      #RotateToGoal.lookahead_time: -1.0
      #Oscillation.scale: 1.0

      BaseObstacle.scale: 0.15      # <-- augmente (0.02 est trop faible)
      PathAlign.scale: 10.0         # <-- baisse
      GoalAlign.scale: 6.0         # <-- baisse
      PathDist.scale: 10.0          # <-- baisse
      GoalDist.scale: 18.0
      Oscillation.scale: 1.0
      #RotateToGoal.scale: 0.3         # au lieu de 4 ou 32
      #RotateToGoal.slowing_factor: 8.0
      #RotateToGoal.lookahead_time: 1.0


recoveries_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 5.0
    global_frame: odom
    robot_base_frame: base_footprint
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"

behavior_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 5.0
    global_frame: odom
    robot_base_frame: base_footprint

    cmd_vel_topic: /cmd_vel_nav
    
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# -----------------
# COSTMAPS
# -----------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.7 # was 0.3
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      #robot_radius: 0.22   # was 0.30
      footprint: "[[0.22,0.16],[0.22,-0.16],[-0.22,-0.16],[-0.22,0.16]]"
      robot_radius: 0.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 5.0
          raytrace_range: 8.0   # was 3.5 (raytrace should be >= obstacle_range)
          # ✅ important for head lidar: ignore too-close hits
          obstacle_min_range: 0.45   
          raytrace_min_range: 0.55   # helps clearing near robot

          footprint_clearing_enabled: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35       # was 0.55
        cost_scaling_factor: 6.0     # was 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 8.0
      publish_frequency: 4.0
      transform_tolerance: 0.7
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      #robot_radius: 0.22   # was 0.30
      footprint: "[[0.22,0.16],[0.22,-0.16],[-0.22,-0.16],[-0.22,0.16]]"
      robot_radius: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 5.0
          raytrace_range: 8.0     # was 3.0
          obstacle_min_range: 0.45 # was 0.35 (head lidar often sees body near)
          raytrace_min_range: 0.45 # was 0.20
          footprint_clearing_enabled: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35 # was 0.55
        cost_scaling_factor: 6.0 # was 3.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false


# -----------------
# Velocity smoother (ENABLED, NO LOOP)
# -----------------
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    # ✅ no loop: controller -> cmd_vel_nav, smoother -> cmd_vel
    cmd_vel_in_topic: /cmd_vel_nav
    cmd_vel_out_topic: /cmd_vel 

    odom_topic: /odom
    # These limits should match what rl_sar + robot can safely do
    # un peu plus réactif pour franchir la zone morte
    max_accel: [1.0, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]

    max_velocity: [0.25, 0.0, 0.35]  # vx, vy, wz
    min_velocity: [-0.10, 0.0, -0.35]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - local_costmap
      - global_costmap
