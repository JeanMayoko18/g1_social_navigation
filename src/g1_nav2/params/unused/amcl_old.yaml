amcl:
  ros__parameters:
    use_sim_time: false

    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: "/scan"
    #map_topic: "/map"
    map_topic: "/map_runtime"

    tf_broadcast: true
    #transform_tolerance: 1.5
    transform_tolerance: 0.2

    robot_model_type: "differential"
    #robot_model_type: "nav2_amcl::DifferentialMotionModel"

    laser_model_type: "likelihood_field"
    #max_beams: 30
    max_beams: 20
    pf_err: 0.05
    pf_z: 0.99

    laser_min_range: -1.0
    laser_max_range: -1.0
    laser_likelihood_max_dist: 2.0
    
    #min_particles: 500
    #max_particles: 1500
    min_particles: 300
    max_particles: 800


    # Debug mode: reduce aggressive AMCL corrections during motion.
    #update_min_d: 0.03
    #update_min_a: 0.03
    update_min_d: 0.02
    update_min_a: 0.02
    resample_interval: 2

    # Disable random particle recovery during this stability test.
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # Noise params (tune if needed; these are safe starters)
    alpha1: 0.20   # rot noise from rot
    alpha2: 0.20   # rot noise from trans
    alpha3: 0.20   # trans noise from trans
    alpha4: 0.20   # trans noise from rot
    alpha5: 0.10   # strafe noise (unused in diff model)

    z_hit: 0.80
    z_rand: 0.15
    z_max: 0.025
    z_short: 0.025
    sigma_hit: 0.25
    lambda_short: 0.1

    do_beamskip: false

    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0