pointcloud_to_laserscan_node:
  ros__parameters:
    target_frame: nav_laser_frame
    transform_tolerance: 1.0

    min_height: -1.0
    max_height: 1.0

    range_min: 0.45
    range_max: 8.0

    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.01745329252

    scan_time: 0.2
    use_inf: true
    inf_epsilon: 1.0