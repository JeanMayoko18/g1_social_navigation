locomotion_calibration_node:
  ros__parameters:

    # Experimental velocity-threshold hypothesis:
    #
    #             0                                     vx <= 0.16
    #   C(vx) = {
    #             0.006057141*(vx - 0.16)/0.04          0.16 < vx <= 0.20
    #
    # This model remains a physical-validation candidate.

    enable_forward_heading_compensation: true

    forward_heading_compensation_model_type: piecewise_linear

    forward_heading_compensation_input_points:
      - 0.0
      - 0.16
      - 0.20

    forward_heading_compensation_output_points:
      - 0.0
      - 0.0
      - 0.006057141

    forward_heading_compensation_domain_min: 0.11
    forward_heading_compensation_domain_max: 0.20

    forward_heading_compensation_outside_domain_policy: disable