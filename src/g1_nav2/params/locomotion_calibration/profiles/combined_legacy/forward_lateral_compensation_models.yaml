# ============================================================================
# FORWARD LATERAL COMPENSATION MODEL PROFILES
# ============================================================================
#
# Purpose:
#   Define runtime models available to the locomotion calibration node.
#
# The launch file selects one profile. The node only evaluates the generic
# mathematical representation contained in that profile.
#
# Polynomial coefficient order:
#
#   C(vx) = c0 + c1*vx + c2*vx^2 + ...
#
# Physical-validation domain:
#
#   0.11 <= vx <= 0.20 m/s
#
# No model declared here is automatically considered scientifically selected.
# ============================================================================

schema_version: "1.0"


profiles:

  # ==========================================================================
  # CONSTANT CANDIDATE
  # ==========================================================================
  #
  # Formula:
  #
  #   C(vx) = c
  #
  # Identified value:
  #
  #   c = 0.012217431368379918 m/s
  # ==========================================================================

  constant:

    status: candidate_for_physical_validation

    derived_from:
      analysis: straight_velocity_model_identification
      candidate: constant

    parameters:

      enable_forward_lateral_compensation: true

      forward_lateral_compensation_model_type: polynomial

      forward_lateral_compensation_coefficients:
        - 0.012217431368379918

      forward_lateral_compensation_domain_min: 0.11
      forward_lateral_compensation_domain_max: 0.20

      forward_lateral_compensation_outside_domain_policy: disable


  # ==========================================================================
  # AFFINE CANDIDATE
  # ==========================================================================
  #
  # Formula:
  #
  #   C(vx) = a*vx + b
  #
  # Polynomial representation:
  #
  #   c0 = b
  #   c1 = a
  #
  # Therefore:
  #
  #   coefficients = [b, a]
  # ==========================================================================

  affine:

    status: candidate_for_physical_validation

    derived_from:
      analysis: straight_velocity_model_identification
      candidate: affine

    parameters:

      enable_forward_lateral_compensation: true

      forward_lateral_compensation_model_type: polynomial

      forward_lateral_compensation_coefficients:
        - 0.01747583141241416
        - -0.035650169790062705

      forward_lateral_compensation_domain_min: 0.11
      forward_lateral_compensation_domain_max: 0.20

      forward_lateral_compensation_outside_domain_policy: disable


  # ==========================================================================
  # PREVIOUS ACTIVE RUNTIME LAW
  # ==========================================================================
  #
  # This profile preserves the previous saturated reference-scaled behavior:
  #
  #   C(vx) = Cref * min(vx / vx_ref, 1)
  #
  # with:
  #
  #   Cref  = 0.003491403315154268 m/s
  #   vxref = 0.12 m/s
  #
  # It is retained for rollback and comparison, not as a newly identified
  # candidate.
  # ==========================================================================

  previous_reference_scaled:

    status: historical_runtime_reference

    parameters:

      enable_forward_lateral_compensation: true

      forward_lateral_compensation_model_type: piecewise_linear

      forward_lateral_compensation_input_points:
        - 0.0
        - 0.12
        - 0.20

      forward_lateral_compensation_output_points:
        - 0.0
        - 0.003491403315154268
        - 0.003491403315154268

      forward_lateral_compensation_domain_min: 0.08
      forward_lateral_compensation_domain_max: 0.20

      forward_lateral_compensation_outside_domain_policy: disable