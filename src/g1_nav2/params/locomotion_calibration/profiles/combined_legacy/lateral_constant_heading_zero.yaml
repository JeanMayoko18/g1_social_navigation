locomotion_calibration_node:
  ros__parameters:

    # -------------------------------------------------------------------------
    # FORWARD LATERAL COMPENSATION
    # -------------------------------------------------------------------------
    #
    # Selected constant lateral model:
    #
    #   vy_compensation(vx) = 0.012217431368379918 m/s
    # -------------------------------------------------------------------------

    enable_forward_lateral_compensation: true

    forward_lateral_compensation_model_type: polynomial

    forward_lateral_compensation_coefficients:
      - 0.012217431368379918

    forward_lateral_compensation_input_points:
      - 0.0
      - 1.0

    forward_lateral_compensation_output_points:
      - 0.0
      - 0.0

    forward_lateral_compensation_domain_min: 0.11
    forward_lateral_compensation_domain_max: 0.20

    forward_lateral_compensation_outside_domain_policy: disable


    # -------------------------------------------------------------------------
    # FORWARD HEADING CONTROL PROFILE
    # -------------------------------------------------------------------------
    #
    # No heading compensation is applied. This profile provides the physical
    # reference required to evaluate whether the threshold model improves
    # straight-motion heading behavior.
    # -------------------------------------------------------------------------

    enable_forward_heading_compensation: false

    forward_heading_compensation_model_type: polynomial

    forward_heading_compensation_coefficients:
      - 0.0

    forward_heading_compensation_input_points:
      - 0.0
      - 1.0

    forward_heading_compensation_output_points:
      - 0.0
      - 0.0

    forward_heading_compensation_domain_min: 0.11
    forward_heading_compensation_domain_max: 0.20

    forward_heading_compensation_outside_domain_policy: disable