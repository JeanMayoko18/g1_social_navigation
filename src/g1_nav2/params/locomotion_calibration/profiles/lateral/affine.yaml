# ============================================================================
# AFFINE FORWARD LATERAL COMPENSATION
#
# Formula:
#
#   C(vx) = a*vx + b
#
# with:
#
#   a = -0.035650169790062705
#   b =  0.01747583141241416 m/s
#
# Polynomial representation:
#
#   coefficients = [b, a]
# ============================================================================

locomotion_calibration_node:

  ros__parameters:

    enable_forward_lateral_compensation: true

    forward_lateral_compensation_model_type: polynomial

    forward_lateral_compensation_coefficients:
      - 0.01747583141241416
      - -0.035650169790062705

    forward_lateral_compensation_domain_min: 0.11
    forward_lateral_compensation_domain_max: 0.20

    forward_lateral_compensation_outside_domain_policy: disable