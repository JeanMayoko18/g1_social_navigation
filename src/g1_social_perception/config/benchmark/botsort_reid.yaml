
# Initial laboratory configuration; values require validation.
tracker_type: botsort

track_high_thresh: 0.30
track_low_thresh: 0.10
new_track_thresh: 0.40

# Temporary tolerance to missed detections, in processed frames.
track_buffer: 45

match_thresh: 0.80
fuse_score: true

# Camera can move with the G1.
gmc_method: sparseOptFlow

# Appearance-assisted association.
with_reid: true
proximity_thresh: 0.50
appearance_thresh: 0.80
model: auto
