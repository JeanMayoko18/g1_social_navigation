scenario:
  id: "S1_REST"
  title: "Stationary robot"

  description: >
    The robot remains physically stationary while raw and calibrated
    odometry are recorded.

  duration_sec: 60.0

  command_source: "none"
  navigation_enabled: false

  ground_truth:
    expected_translation_m: 0.0
    expected_rotation_deg: 0.0
    method: "physical_stationarity"

  variants:
    - id: "STATIC"
      description: "Robot standing without commanded motion"

  configurations:
    - "B0_RAW"
    - "B1_SAFE"
    - "A8_NO_HOLD"
    - "FULL"

  repetitions_preliminary: 3
  repetitions_final: 10

  primary_metrics:
    - "rest_position_drift"
    - "rest_yaw_drift"
    - "rest_twist_std"
    - "stationary_hold_rate"
    - "false_motion_rate"