ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 1.0
    two_d_mode: true

    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom_dog_norm
    odom0_config: [
      true,  true,  false,   # x y z
      false, false, true,    # roll pitch yaw
      true,  false, false,   # vx vy vz
      false, false, false,   # vroll vpitch vyaw
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10